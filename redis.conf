# Redis configuration for n8n job queue
# General settings
bind 0.0.0.0
port 6379
timeout 300
tcp-keepalive 300

# Persistence settings
save 60 1
appendonly yes
appendfsync everysec

# Security settings
requirepass ${REDIS_PASSWORD:-n8nredispassword}
databases 1

# Memory settings
maxmemory 256mb
maxmemory-policy allkeys-lru

# Keyspace notifications
notify-keyspace-events Ex

# TLS settings (to be enabled when certificates are available)
tls-port 6380
# port 0  # Uncomment to disable non-TLS port when TLS is fully enabled
tls-cert-file /etc/ssl/redis/redis.crt
tls-key-file /etc/ssl/redis/redis.key
tls-ca-cert-file /etc/ssl/redis/ca.crt
tls-auth-clients no  # Set to yes in production, no for testing
tls-protocols "TLSv1.2 TLSv1.3"