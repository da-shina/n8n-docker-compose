services:
  n8n:
    image: docker.n8n.io/n8nio/n8n:latest
    restart: unless-stopped
    ports:
      - "5678:5678"
    env_file:
      - .env
    environment:
      - N8N_USER_FOLDER=/home/node/.n8n
      - N8N_RUNNERS_MODE=external
      - N8N_RUNNERS_AUTH_TOKEN=${N8N_RUNNERS_AUTH_TOKEN}
      - N8N_RUNNERS_BROKER_LISTEN_ADDRESS=0.0.0.0
      - N8N_RUNNERS_BROKER_PORT=5679
      - EXECUTIONS_MODE=queue
      - QUEUE_BULL_REDIS_HOST=redis
      - QUEUE_BULL_REDIS_PORT=6379
      # Redis TLS 設定 - 無効化 (Redisサーバーが非TLSモードで実行されているため)
      - N8N_REDIS_TLS_ENABLED=false
      - N8N_REDIS_TLS_REJECT_UNAUTHORIZED=false
      # Redis 接続安定性のための追加設定
      - QUEUE_BULL_REDIS_CONNECT_TIMEOUT=50000
      - QUEUE_BULL_REDIS_RETRY_DELAY=5000
      - QUEUE_BULL_REDIS_MAX_ATTEMPTS=10
      - QUEUE_BULL_REDIS_DB=0
      # Pythonタスクランナーのエラーを回避するための設定
      - OFFLOAD_MANUAL_EXECUTIONS_TO_WORKERS=true
      # ユーザー管理設定
      - N8N_USER_MANAGEMENT_JWT_SECRET=${N8N_ENCRYPTION_KEY}
      - N8N_USER_MANAGEMENT_DISABLED=false
    volumes:
      - n8n_data:/home/node/.n8n
      - playwright_data:/home/node/user-data
      - ./redis.conf:/usr/local/etc/redis/redis.conf:ro
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - default
    depends_on:
      redis:
        condition: service_started
    user: "1000:1000"
    secrets:
      - redis_password

  n8n-task-runner:
    build:
      context: .
      dockerfile: Dockerfile.taskrunner
    restart: unless-stopped
    env_file:
      - .env
    user: "1000:1000"
    volumes:
      - n8n_data:/home/node/.n8n
      - playwright_data:/home/node/user-data
      - ./start.sh:/app/start.sh:ro
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - default
    environment:
      - N8N_RUNNERS_MODE=external
      - N8N_INSTANCE_TYPE=runner
      - EXECUTIONS_MODE=queue
      - QUEUE_BULL_REDIS_HOST=redis
      - QUEUE_BULL_REDIS_PORT=6379
      - N8N_RUNNERS_AUTH_TOKEN=${N8N_RUNNERS_AUTH_TOKEN}
      - N8N_RUNNERS_TASK_BROKER_URI=ws://n8n:5679
      # Redis TLS 設定 - 無効化 (Redisサーバーが非TLSモードで実行されているため)
      - N8N_REDIS_TLS_ENABLED=false
      - N8N_REDIS_TLS_REJECT_UNAUTHORIZED=false
      # Redis 接続安定性のための追加設定
      - QUEUE_BULL_REDIS_CONNECT_TIMEOUT=50000
      - QUEUE_BULL_REDIS_RETRY_DELAY=5000
      - QUEUE_BULL_REDIS_MAX_ATTEMPTS=10
      - QUEUE_BULL_REDIS_DB=0
      # Pythonタスクランナーのエラーを回避するための設定
      - OFFLOAD_MANUAL_EXECUTIONS_TO_WORKERS=true
    secrets:
      - redis_password

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    # redis.conf を使用して設定を読み込む (パスワードなし)
    command: redis-server /usr/local/etc/redis/redis.conf
    user: "0:0"
    volumes:
      - redis_data:/data
      - ./redis.conf:/usr/local/etc/redis/redis.conf:ro
    networks:
      - default
    environment:
      - REDIS_DB=0
      - REDIS_MAXMEMORY=256mb
      - REDIS_MAXMEMORY_POLICY=allkeys-lru
      - REDIS_NOTIFY_KEYSPACE_EVENTS=Ex

  playwright:
    build:
      context: .
      dockerfile: Dockerfile.playwright-mcp
    restart: unless-stopped
    ports:
      - "8931:8931"
    networks:
      - default

  vnc:
    build:
      context: .
      dockerfile: Dockerfile.vnc
    restart: unless-stopped
    ports:
      - "5900:5900"
    user: "1000:1000"
    volumes:
      - playwright_data:/home/pwuser/user-data
      - ./start.sh:/app/start.sh:ro
    environment:
      - VNC_PASSWORD=n8npassword
    networks:
      - default

volumes:
  n8n_data:
    name: n8n-docker-compose_n8n_data
    external: true
  playwright_data:
    name: n8n-docker-compose_playwright_data
    external: true
  redis_data:
    name: n8n-docker-compose_redis_data
    external: true

secrets:
  redis_password:
    file: ./secrets/redis_password

networks:
  default:
    driver: bridge
