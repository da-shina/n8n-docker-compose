# Redis Cluster Configuration for n8n
# Cluster settings
cluster-enabled yes
cluster-config-file nodes.conf
cluster-node-timeout 5000
cluster-require-full-coverage no

# General settings
bind 0.0.0.0
port 7000
timeout 300
tcp-keepalive 300

# Persistence settings
save 60 1
appendonly yes
appendfsync everysec

# Security settings
requirepass ${REDIS_PASSWORD:-n8nredispassword}
masterauth ${REDIS_PASSWORD:-n8nredispassword}
databases 1

# Memory settings
maxmemory 256mb
maxmemory-policy allkeys-lru

# Keyspace notifications
notify-keyspace-events Ex