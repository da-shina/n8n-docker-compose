# n8n ジョブキュー用の Redis 設定
# 一般設定
bind 0.0.0.0
port 6379
timeout 600
tcp-keepalive 600

# ネットワークパフォーマンス設定
tcp-backlog 128

# 永続化設定 (データの耐久性のため AOF を有効化)
dir /data
save 900 1
save 300 10
save 60 10000
appendonly yes
appendfilename "appendonly.aof"
appendfsync everysec

# セキュリティ設定
# パスワードは docker-compose.yml が .env の REDIS_PASSWORD から --requirepass で渡す
databases 1

# メモリ設定
# ジョブキューを保持するため、メモリ不足時は evict せず書き込みを失敗させる
maxmemory 512mb
maxmemory-policy noeviction

# 追加のパフォーマンス設定
repl-diskless-sync-delay 5
hz 10
dynamic-hz yes
latency-monitor-threshold 100

# キースペース通知
notify-keyspace-events Ex
