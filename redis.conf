# Redis configuration for n8n job queue
# General settings
bind 0.0.0.0
port 6379
timeout 600
tcp-keepalive 600

# Network performance settings
tcp-backlog 128

# Persistence settings (AOF enabled for data durability)
dir /data
save 900 1
save 300 10
save 60 10000
appendonly yes
appendfilename "appendonly.aof"
appendfsync everysec

# Security settings
# Redis パスワードは docker-compose.yml で secrets 経由で設定
databases 1

# Memory settings
maxmemory 512mb
maxmemory-policy allkeys-lru

# Additional performance settings
repl-diskless-sync-delay 5
hz 10
dynamic-hz yes
latency-monitor-threshold 100

# Keyspace notifications
notify-keyspace-events Ex

# TLS settings (temporarily commented out to resolve permission issues)
# tls-port 6380
# port 0  # Uncomment to disable non-TLS port when TLS is fully enabled
# tls-cert-file /etc/ssl/redis/redis.crt
# tls-key-file /etc/ssl/redis/redis.key
# tls-ca-cert-file /etc/ssl/redis/ca.crt
# Set to yes in production, no for testing
# tls-auth-clients no
# tls-protocols "TLSv1.2 TLSv1.3"