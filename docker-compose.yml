services:
  n8n:
    build:
      context: .
    restart: unless-stopped
    ports:
      - "5678:5678"
    env_file:
      - .env
    volumes:
      - ./n8n_data:/home/node/.n8n
      - ./playwright_data:/home/node/user-data
      - ./start.sh:/app/start.sh:ro
      - ./ssl/redis:/etc/ssl/redis:ro
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - default
    depends_on:
      - redis
      - n8n-task-runner
    environment:
      - N8N_RUNNERS_MODE=external
      - N8N_RUNNERS_CONNECT_TO_URL=http://n8n-task-runner:5678
      - N8N_REDIS_HOST=redis
      - N8N_REDIS_PORT=6379
      - N8N_REDIS_TLS_ENABLED=true
      - N8N_REDIS_PASSWORD_FILE=/run/secrets/redis_password
    secrets:
      - redis_password
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:5678/healthz"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

  n8n-task-runner:
    build:
      context: .
    restart: unless-stopped
    env_file:
      - .env
    volumes:
      - ./n8n_data:/home/node/.n8n
      - ./playwright_data:/home/node/user-data
      - ./start.sh:/app/start.sh:ro
      - ./ssl/redis:/etc/ssl/redis:ro
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - default
    environment:
      - N8N_RUNNERS_MODE=runner
      - N8N_INSTANCE_TYPE=runner
      - N8N_REDIS_HOST=redis
      - N8N_REDIS_PORT=6379
      - N8N_REDIS_TLS_ENABLED=true
      - N8N_REDIS_PASSWORD_FILE=/run/secrets/redis_password
    secrets:
      - redis_password
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    healthcheck:
      test: ["CMD", "pgrep", "-f", "n8n"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    ports:
      - "6379:6379"
      - "6380:6380"
    volumes:
      - ./redis_data:/data
      - ./redis.conf:/usr/local/etc/redis/redis.conf
      - ./redis-cluster.conf:/usr/local/etc/redis/redis-cluster.conf
      - ./ssl/redis:/etc/ssl/redis
    command: [
      "sh", "-c", "redis-server /usr/local/etc/redis/redis.conf --requirepass '$$(cat /run/secrets/redis_password)'"
    ]
    networks:
      - default
    environment:
      - REDIS_DB=0
      - REDIS_MAXMEMORY=256mb
      - REDIS_MAXMEMORY_POLICY=allkeys-lru
      - REDIS_NOTIFY_KEYSPACE_EVENTS=Ex
      - REDIS_ENABLE_TLS=true
      - REDIS_TLS_PORT=6380
      - REDIS_CLUSTER_ENABLED=false
      - REDIS_CLUSTER_NODES=redis
    secrets:
      - redis_password
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    healthcheck:
      test: ["CMD", "sh", "-c", "redis-cli -h localhost -p 6379 -a '$$(cat /run/secrets/redis_password)' ping"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

  playwright:
    image: mcr.microsoft.com/playwright:v1.40.0-jammy
    restart: unless-stopped
    ports:
      - "8931:8931"
    volumes:
      - ./playwright_data:/home/pwuser/user-data
    environment:
      - PLAYWRIGHT_SERVER_PORT=8931
    networks:
      - default
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    healthcheck:
      test: ["CMD", "bash", "-c", "netstat -tuln | grep 8931"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

  vnc:
    build:
      context: .
    restart: unless-stopped
    ports:
      - "5900:5900"
    volumes:
      - ./playwright_data:/home/pwuser/user-data
      - ./start.sh:/app/start.sh:ro
    environment:
      - VNC_PASSWORD=n8npassword
    networks:
      - default
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    healthcheck:
      test: ["CMD", "bash", "-c", "netstat -tuln | grep 5900"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

secrets:
  redis_password:
    file: ./secrets/redis_password

networks:
  default:
    driver: bridge