# Redis configuration for n8n job queue
# General settings
bind 0.0.0.0
port 6379
timeout 600
tcp-keepalive 600

# Network performance settings
tcp-backlog 128

# Persistence settings (AOF enabled for data durability)
dir /data
save 900 1
save 300 10
save 60 10000
appendonly yes
appendfilename "appendonly.aof"
appendfsync everysec

# Security settings
# パスワードは docker-compose.yml が .env の REDIS_PASSWORD から --requirepass で渡す
databases 1

# Memory settings
# ジョブキューを保持するため、メモリ不足時は evict せず書き込みを失敗させる
maxmemory 512mb
maxmemory-policy noeviction

# Additional performance settings
repl-diskless-sync-delay 5
hz 10
dynamic-hz yes
latency-monitor-threshold 100

# Keyspace notifications
notify-keyspace-events Ex
